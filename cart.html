<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cart - FreshMart Grocery Store</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f5f5f5;
}

header {
    background: #4CAF50;
    color: white;
    padding: 20px;
    text-align: center;
}

nav {
    background: #333;
    padding: 10px;
    text-align: center;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 15px;
    font-size: 18px;
}

.container {
    width: 90%;
    margin: auto;
    padding: 20px;
}

.item {
    background: white;
    padding: 15px;
    margin-bottom: 10px;
    border-radius: 10px;
    display: flex;
    justify-content: space-between;
}

button {
    background: red;
    color: white;
    border: none;
    padding: 6px 12px;
    cursor: pointer;
}
</style>
</head>
<body>

<header>
    <h1>Shopping Cart</h1>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="cart.html">Cart</a>
    <a href="contact.html">Contact</a>
</nav>

<div class="container">

    <div id="cartItems"></div>

    <h2>Total: $<span id="total">0.00</span></h2>

</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

let total = 0;
let output = "";

cart.forEach((item, index) => {
    total += item.price;

    output += `
        <div class="item">
            <span>${item.name} - $${item.price.toFixed(2)}</span>
            <button onclick="removeItem(${index})">Remove</button>
        </div>
    `;
});

document.getElementById("cartItems").innerHTML = output;
document.getElementById("total").textContent = total.toFixed(2);

function removeItem(index){
    cart.splice(index,1);
    localStorage.setItem("cart", JSON.stringify(cart));
    location.reload();
}
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Contact FreshMart</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:0;
}

header{
    background:#4CAF50;
    color:white;
    text-align:center;
    padding:20px;
}

nav{
    background:#333;
    padding:10px;
    text-align:center;
}

nav a{
    color:white;
    margin:15px;
    text-decoration:none;
}

.container{
    width:90%;
    max-width:700px;
    margin:20px auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

input,
textarea{
    width:100%;
    padding:10px;
    margin-bottom:15px;
}

button{
    background:#4CAF50;
    color:white;
    border:none;
    padding:10px;
    cursor:pointer;
}
</style>
</head>

<body>

<header>
<h1>Contact Us</h1>
</header>

<nav>
<a href="index.html">Home</a>
<a href="cart.html">Cart</a>
<a href="contact.html">Contact</a>
</nav>

<div class="container">

<form>

<input
type="text"
placeholder="Your Name"
required>

<input
type="email"
placeholder="Your Email"
<textarea
placeholder="Your Message"
rows="6"
required></textarea>

<button type="submit">
Send Message
</button>

</form>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreshMart Grocery Store</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f5f5f5;
}

header {
    background: #4CAF50;
    color: white;
    padding: 20px;
    text-align: center;
}

nav {
    background: #333;
    padding: 10px;
    text-align: center;
}

nav a {
    color: white;
    margin: 15px;
    text-decoration: none;
    font-size: 18px;
}

.container {
    width: 90%;
    margin: auto;
    padding: 20px;
}

.item-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

.item {
    background: white;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 0 10px #ccc;
    text-align: center;
}

.item img {
    width: 150px;
    height: 150px;
    object-fit: cover;
}

.item button {
    background: #4CAF50;
    color: white;
    padding: 10px;
    border: none;
    margin-top: 10px;
    cursor: pointer;
    border-radius: 5px;
}

.item button:hover {
    background: #45a049;
}

footer {
    background: #333;
    color: white;
    padding: 15px;
    text-align: center;
    margin-top: 30px;
}
</style>
</head>

<body>

<header>
    <h1>FreshMart Grocery Store</h1>
    <p>Your daily fresh food delivered</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="cart.html">Cart</a>
    <a href="contact.html">Contact</a>
</nav>

<div class="container">

<h2>Popular Items</h2>

<div class="item-grid">

    <div class="item">
        <img src="https://via.placeholder.com/150" alt="Apples">
        <h3>Fresh Apples</h3>
        <p>$3.99 / kg</p>
        <button onclick="addToCart('Fresh Apples',3.99)">
            Add To Cart
        </button>
    </div>

    <div class="item">
        <img src="https://via.placeholder.com/150" alt="Bananas">
        <h3>Bananas</h3>
        <p>$2.49 / kg</p>
        <button onclick="addToCart('Bananas',2.49)">
            Add To Cart
        </button>
    </div>

    <div class="item">
        <img src="https://via.placeholder.com/150" alt="Milk">
        <h3>Full Cream Milk</h3>
        <p>$1.99</p>
        <button onclick="addToCart('Full Cream Milk',1.99)">
            Add To Cart
        </button>
    </div>

    <div class="item">
        <img src="https://via.placeholder.com/150" alt="Bread">
        <h3>Wholegrain Bread</h3>
        <p>$2.50</p>
        <button onclick="addToCart('Wholegrain Bread',2.50)">
            Add To Cart
        </button>
    </div>

    <div class="item">
        <img src="https://via.placeholder.com/150" alt="Eggs">
        <h3>Free Range Eggs</h3>
        <p>$4.99</p>
        <button onclick="addToCart('Free Range Eggs',4.99)">
            Add To Cart
        </button>
    </div>

    <div class="item">
        <img src="https://via.placeholder.com/150" alt="Chicken">
        <h3>Chicken Breast</h3>
        <p>$8.99 / kg</p>
        <button onclick="addToCart('Chicken Breast',8.99)">
            Add To Cart
        </button>
    </div>

</div>

</div>

<footer>
    <p>FreshMart Grocery Store © 2026</p>
</footer>

<script>
function addToCart(name, price) {

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    cart.push({
        name: name,
        price: price
    });

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

    alert(name + " added to cart!");
}
</script>

</body>
</html>
